name: Handoff Summary

on:
  workflow_dispatch:

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Write handoff summary log
        run: |
          {
            echo "handoff summary run"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_number=${GITHUB_RUN_NUMBER}"
            echo "started_at=${GITHUB_STARTED_AT}"
            echo "completed_at=${GITHUB_ACTOR}"
          } > handoff-summary.txt
          cat handoff-summary.txt
      - name: Upload handoff summary artifact
        uses: actions/upload-artifact@v4
        with:
          name: handoff-summary
          path: handoff-summary.txt
